<!DOCTYPE html>
<html lang="zh-TW" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - 待辦事項管理系統</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            500: '#0ea5e9',
                            600: '#0284c7',
                            700: '#0369a1',
                        }
                    }
                }
            }
        }
    </script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Canvas Confetti for Celebration effect -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- Custom Scrollbar & Animations -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body {
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        /* Custom scrollbar for task list */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 9999px;
        }
        .dark ::-webkit-scrollbar-thumb {
            background: #475569;
        }
        /* Task item transition styling */
        .task-card {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .task-card:hover {
            transform: translateY(-2px);
        }
        .completed-line {
            position: relative;
        }
        .completed-line::after {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            width: 100%;
            height: 2px;
            background-color: currentColor;
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.25s ease-in-out;
        }
        .is-completed .completed-line::after {
            transform: scaleX(1);
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen transition-colors duration-300 flex flex-col">

    <!-- Navigation Header -->
    <header class="sticky top-0 z-30 bg-white/80 dark:bg-slate-800/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-700 shadow-sm">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-4">
            <!-- Brand Logo -->
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-sky-500 to-indigo-600 flex items-center justify-center text-white shadow-md shadow-sky-500/20">
                    <i class="fa-solid font-bold fa-check-double text-xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-sky-600 to-indigo-600 dark:from-sky-400 dark:to-indigo-400">
                        TaskFlow
                    </h1>
                    <p class="text-xs text-slate-500 dark:text-slate-400 hidden sm:block">智慧待辦清單系統</p>
                </div>
            </div>

            <!-- Global Action Tools -->
            <div class="flex items-center gap-2 sm:gap-3">
                <!-- Theme Toggle Button -->
                <button id="themeToggleBtn" onclick="toggleDarkMode()" title="切換主題" class="p-2.5 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 transition-colors">
                    <i class="fa-solid fa-moon text-lg dark:hidden"></i>
                    <i class="fa-solid fa-sun text-lg hidden dark:block text-amber-400"></i>
                </button>

                <!-- Data Backup Dropdown / Actions -->
                <div class="relative">
                    <button onclick="toggleDataMenu()" class="p-2.5 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 transition-colors flex items-center gap-1.5 text-sm font-medium">
                        <i class="fa-solid fa-database text-sky-500"></i>
                        <span class="hidden md:inline">資料管理</span>
                        <i class="fa-solid fa-chevron-down text-xs opacity-60"></i>
                    </button>
                    <!-- Data Menu Dropdown -->
                    <div id="dataMenu" class="hidden absolute right-0 mt-2 w-48 bg-white dark:bg-slate-800 rounded-xl shadow-lg border border-slate-100 dark:border-slate-700 py-1.5 z-50 text-sm">
                        <button onclick="exportTasks()" class="w-full text-left px-4 py-2 hover:bg-slate-50 dark:hover:bg-slate-700 flex items-center gap-2.5 text-slate-700 dark:text-slate-200">
                            <i class="fa-solid fa-download text-emerald-500 w-4"></i> 匯出 JSON 備份
                        </button>
                        <button onclick="triggerImport()" class="w-full text-left px-4 py-2 hover:bg-slate-50 dark:hover:bg-slate-700 flex items-center gap-2.5 text-slate-700 dark:text-slate-200">
                            <i class="fa-solid fa-upload text-sky-500 w-4"></i> 匯入 JSON 資料
                        </button>
                        <input type="file" id="importFileInput" onchange="importTasks(event)" accept=".json" class="hidden">
                        <hr class="my-1 border-slate-100 dark:border-slate-700">
                        <button onclick="clearAllData()" class="w-full text-left px-4 py-2 hover:bg-red-50 dark:hover:bg-red-950/30 text-rose-600 dark:text-rose-400 flex items-center gap-2.5">
                            <i class="fa-solid fa-trash-can w-4"></i> 清空所有資料
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content Grid -->
    <main class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-grow w-full">
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
            
            <!-- Left Sidebar / Overview Stats (4 cols on lg) -->
            <aside class="lg:col-span-4 space-y-6">
                <!-- Stats Overview Card -->
                <div class="bg-white dark:bg-slate-800 rounded-2xl p-6 border border-slate-200/80 dark:border-slate-700/80 shadow-sm">
                    <h2 class="text-base font-semibold text-slate-900 dark:text-white mb-4 flex items-center justify-between">
                        <span>進度總覽</span>
                        <span id="completionBadge" class="text-xs px-2.5 py-1 rounded-full bg-sky-100 dark:bg-sky-950 text-sky-600 dark:text-sky-300 font-medium">0%</span>
                    </h2>
                    
                    <!-- Progress Bar -->
                    <div class="w-full bg-slate-100 dark:bg-slate-700 h-2.5 rounded-full overflow-hidden mb-6">
                        <div id="progressBar" class="bg-gradient-to-r from-sky-500 to-indigo-600 h-full w-0 transition-all duration-500 rounded-full"></div>
                    </div>

                    <!-- Statistics Grid -->
                    <div class="grid grid-cols-2 gap-3">
                        <div class="bg-slate-50 dark:bg-slate-700/40 p-3.5 rounded-xl border border-slate-100 dark:border-slate-700/50">
                            <p class="text-xs text-slate-500 dark:text-slate-400">總任務數</p>
                            <p id="statTotal" class="text-xl font-bold text-slate-800 dark:text-slate-100 mt-1">0</p>
                        </div>
                        <div class="bg-slate-50 dark:bg-slate-700/40 p-3.5 rounded-xl border border-slate-100 dark:border-slate-700/50">
                            <p class="text-xs text-slate-500 dark:text-slate-400">已完成</p>
                            <p id="statCompleted" class="text-xl font-bold text-emerald-600 dark:text-emerald-400 mt-1">0</p>
                        </div>
                        <div class="bg-slate-50 dark:bg-slate-700/40 p-3.5 rounded-xl border border-slate-100 dark:border-slate-700/50">
                            <p class="text-xs text-slate-500 dark:text-slate-400">未完成</p>
                            <p id="statPending" class="text-xl font-bold text-amber-600 dark:text-amber-400 mt-1">0</p>
                        </div>
                        <div class="bg-slate-50 dark:bg-slate-700/40 p-3.5 rounded-xl border border-slate-100 dark:border-slate-700/50">
                            <p class="text-xs text-slate-500 dark:text-slate-400">逾期事項</p>
                            <p id="statOverdue" class="text-xl font-bold text-rose-600 dark:text-rose-400 mt-1">0</p>
                        </div>
                    </div>
                </div>

                <!-- Category Navigation -->
                <div class="bg-white dark:bg-slate-800 rounded-2xl p-6 border border-slate-200/80 dark:border-slate-700/80 shadow-sm">
                    <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400 dark:text-slate-500 mb-3">分類選單</h3>
                    <nav id="categoryList" class="space-y-1">
                        <!-- Category items dynamically populated -->
                    </nav>
                </div>
            </aside>

            <!-- Main Content Area (8 cols on lg) -->
            <section class="lg:col-span-8 space-y-6">
                
                <!-- Quick Add Task Bar -->
                <div class="bg-white dark:bg-slate-800 rounded-2xl p-4 sm:p-5 border border-slate-200/80 dark:border-slate-700/80 shadow-sm space-y-3">
                    <form id="addTaskForm" onsubmit="handleAddTask(event)" class="space-y-3">
                        <div class="flex items-center gap-3">
                            <input type="text" id="taskTitleInput" placeholder="準備做些什麼？輸入任務名稱..." required
                                class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-3 text-slate-800 dark:text-slate-100 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-sky-500 dark:focus:ring-sky-400 transition">
                            <button type="submit" 
                                class="bg-gradient-to-r from-sky-500 to-indigo-600 hover:from-sky-600 hover:to-indigo-700 text-white font-medium px-5 py-3 rounded-xl shadow-md shadow-sky-500/20 shrink-0 transition flex items-center gap-2">
                                <i class="fa-solid fa-plus"></i>
                                <span class="hidden sm:inline">新增</span>
                            </button>
                        </div>

                        <!-- Task Details (Category, Priority, Due Date) Options -->
                        <div class="flex flex-wrap items-center gap-2 pt-1 text-sm">
                            <!-- Category Select -->
                            <div class="relative flex-1 min-w-[120px]">
                                <select id="taskCategoryInput" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg px-3 py-2 text-xs sm:text-sm text-slate-700 dark:text-slate-300 focus:outline-none focus:ring-1 focus:ring-sky-500">
                                    <option value="工作">💼 工作</option>
                                    <option value="個人">👤 個人</option>
                                    <option value="學習">📚 學習</option>
                                    <option value="購物">🛒 購物</option>
                                    <option value="健康">💪 健康</option>
                                </select>
                            </div>

                            <!-- Priority Select -->
                            <div class="relative flex-1 min-w-[110px]">
                                <select id="taskPriorityInput" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg px-3 py-2 text-xs sm:text-sm text-slate-700 dark:text-slate-300 focus:outline-none focus:ring-1 focus:ring-sky-500">
                                    <option value="low">🟢 低優先級</option>
                                    <option value="medium" selected>🟡 中優先級</option>
                                    <option value="high">🔴 高優先級</option>
                                </select>
                            </div>

                            <!-- Due Date Picker -->
                            <div class="relative flex-1 min-w-[130px]">
                                <input type="date" id="taskDueDateInput" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg px-3 py-2 text-xs sm:text-sm text-slate-700 dark:text-slate-300 focus:outline-none focus:ring-1 focus:ring-sky-500">
                            </div>
                        </div>
                    </form>
                </div>

                <!-- Filter & Search Controls Bar -->
                <div class="flex flex-col sm:flex-row gap-3 justify-between items-stretch sm:items-center">
                    <!-- Status Filter Tabs -->
                    <div class="flex bg-slate-200/60 dark:bg-slate-800 p-1 rounded-xl text-xs sm:text-sm">
                        <button onclick="setFilterStatus('all')" id="tabAll" class="filter-tab flex-1 sm:flex-initial px-3.5 py-1.5 rounded-lg font-medium transition text-slate-600 dark:text-slate-400">
                            全部
                        </button>
                        <button onclick="setFilterStatus('active')" id="tabActive" class="filter-tab flex-1 sm:flex-initial px-3.5 py-1.5 rounded-lg font-medium transition text-slate-600 dark:text-slate-400">
                            進行中
                        </button>
                        <button onclick="setFilterStatus('completed')" id="tabCompleted" class="filter-tab flex-1 sm:flex-initial px-3.5 py-1.5 rounded-lg font-medium transition text-slate-600 dark:text-slate-400">
                            已完成
                        </button>
                    </div>

                    <!-- Search & Sort Controls -->
                    <div class="flex items-center gap-2">
                        <!-- Search Box -->
                        <div class="relative flex-1 sm:w-48">
                            <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                            <input type="text" id="searchInput" oninput="handleSearch()" placeholder="搜尋關鍵字..."
                                class="w-full pl-8 pr-3 py-1.5 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-xs sm:text-sm text-slate-700 dark:text-slate-200 focus:outline-none focus:ring-1 focus:ring-sky-500">
                        </div>

                        <!-- Sort Option Dropdown -->
                        <select id="sortByInput" onchange="renderTasks()" class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-2.5 py-1.5 text-xs sm:text-sm text-slate-700 dark:text-slate-200 focus:outline-none focus:ring-1 focus:ring-sky-500">
                            <option value="created-desc">🆕 最新建立</option>
                            <option value="dueDate-asc">📅 到期日 (近到遠)</option>
                            <option value="priority-desc">⚡ 優先級 (高到低)</option>
                        </select>
                    </div>
                </div>

                <!-- Task List Container -->
                <div id="taskList" class="space-y-3 min-h-[250px]">
                    <!-- Dynamic Task Cards will be inserted here -->
                </div>

                <!-- Batch Actions Bar -->
                <div class="flex items-center justify-between text-xs sm:text-sm text-slate-500 dark:text-slate-400 pt-2 border-t border-slate-200 dark:border-slate-800">
                    <span id="activeCountText">剩餘 0 個未完成任務</span>
                    <button onclick="clearCompletedTasks()" class="hover:text-rose-600 dark:hover:text-rose-400 transition flex items-center gap-1">
                        <i class="fa-solid fa-broom"></i> 清除已完成事項
                    </button>
                </div>
            </section>
        </div>
    </main>

    <!-- Task Edit Modal -->
    <div id="editModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 opacity-0 pointer-events-none transition-opacity duration-200">
        <div class="bg-white dark:bg-slate-800 rounded-2xl max-w-lg w-full p-6 shadow-xl border border-slate-100 dark:border-slate-700 space-y-4 transform scale-95 transition-transform duration-200" id="modalContainer">
            <div class="flex items-center justify-between border-b border-slate-100 dark:border-slate-700 pb-3">
                <h3 class="text-lg font-bold text-slate-900 dark:text-white flex items-center gap-2">
                    <i class="fa-solid fa-pen-to-square text-sky-500"></i> 編輯任務
                </h3>
                <button onclick="closeEditModal()" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 text-lg">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <form id="editTaskForm" onsubmit="saveEditedTask(event)" class="space-y-4">
                <input type="hidden" id="editTaskId">
                
                <div>
                    <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">任務標題</label>
                    <input type="text" id="editTitleInput" required class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-slate-800 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-sky-500">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">詳細說明 / 備忘錄</label>
                    <textarea id="editDescInput" rows="3" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-slate-800 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-sky-500" placeholder="補充細節或筆記..."></textarea>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">分類</label>
                        <select id="editCategoryInput" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-2 text-sm">
                            <option value="工作">💼 工作</option>
                            <option value="個人">👤 個人</option>
                            <option value="學習">📚 學習</option>
                            <option value="購物">🛒 購物</option>
                            <option value="健康">💪 健康</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">優先級</label>
                        <select id="editPriorityInput" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-2 text-sm">
                            <option value="low">🟢 低</option>
                            <option value="medium">🟡 中</option>
                            <option value="high">🔴 高</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">到期日</label>
                        <input type="date" id="editDueDateInput" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-2 text-sm">
                    </div>
                </div>

                <!-- Subtasks Management -->
                <div>
                    <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">子任務 / 清單</label>
                    <div id="subtaskContainer" class="space-y-2 mb-2 max-h-36 overflow-y-auto pr-1">
                        <!-- Subtasks will be dynamically rendered here -->
                    </div>
                    <div class="flex gap-2">
                        <input type="text" id="newSubtaskInput" placeholder="新增子項目..." class="flex-1 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg px-3 py-1.5 text-xs">
                        <button type="button" onclick="handleAddSubtask()" class="px-3 py-1.5 bg-slate-200 dark:bg-slate-700 rounded-lg text-xs font-medium hover:bg-slate-300 transition">新增</button>
                    </div>
                </div>

                <div class="flex justify-end gap-3 pt-3 border-t border-slate-100 dark:border-slate-700">
                    <button type="button" onclick="closeEditModal()" class="px-4 py-2 rounded-xl text-sm font-medium text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 transition">取消</button>
                    <button type="submit" class="px-5 py-2 rounded-xl text-sm font-medium bg-sky-500 hover:bg-sky-600 text-white shadow-sm transition">儲存修改</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Notification Toast Container -->
    <div id="toastContainer" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <!-- Footer -->
    <footer class="mt-auto py-6 border-t border-slate-200/60 dark:border-slate-800 text-center text-xs text-slate-400">
        <p>TaskFlow &copy; 待辦清單網頁版 — 本地端 LocalStorage 安全儲存</p>
    </footer>

    <script>
        /* TaskFlow Application Core Script */

        // LocalStorage Key Constants
        const STORAGE_KEY = 'taskflow_tasks_v2';
        const THEME_KEY = 'taskflow_theme';

        // Application State
        let tasks = [];
        let currentFilterStatus = 'all'; // 'all', 'active', 'completed'
        let currentFilterCategory = 'all'; // 'all' or category string
        let searchQuery = '';
        let currentEditingSubtasks = [];

        // Category configurations
        const categoriesConfig = {
            '工作': { icon: 'fa-briefcase', color: 'text-blue-500 bg-blue-50 dark:bg-blue-950/40 border-blue-200 dark:border-blue-800' },
            '個人': { icon: 'fa-user', color: 'text-purple-500 bg-purple-50 dark:bg-purple-950/40 border-purple-200 dark:border-purple-800' },
            '學習': { icon: 'fa-book', color: 'text-amber-500 bg-amber-50 dark:bg-amber-950/40 border-amber-200 dark:border-amber-800' },
            '購物': { icon: 'fa-cart-shopping', color: 'text-emerald-500 bg-emerald-50 dark:bg-emerald-950/40 border-emerald-200 dark:border-emerald-800' },
            '健康': { icon: 'fa-heart-pulse', color: 'text-rose-500 bg-rose-50 dark:bg-rose-950/40 border-rose-200 dark:border-rose-800' }
        };

        // Priority configurations
        const priorityConfig = {
            high: { label: '高優先', color: 'text-rose-600 dark:text-rose-400 bg-rose-50 dark:bg-rose-950/50' },
            medium: { label: '中優先', color: 'text-amber-600 dark:text-amber-400 bg-amber-50 dark:bg-amber-950/50' },
            low: { label: '低優先', color: 'text-emerald-600 dark:text-emerald-400 bg-emerald-50 dark:bg-emerald-950/50' }
        };

        // Initialize App on DOM Loaded
        document.addEventListener('DOMContentLoaded', () => {
            initTheme();
            loadTasksFromStorage();
            
            // Set default date input to today
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('taskDueDateInput').value = today;

            // Close data menu on outer click
            document.addEventListener('click', (e) => {
                const dataMenu = document.getElementById('dataMenu');
                if (!e.target.closest('.relative')) {
                    dataMenu.classList.add('hidden');
                }
            });
        });

        // Theme Handling
        function initTheme() {
            const savedTheme = localStorage.getItem(THEME_KEY);
            if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        }

        function toggleDarkMode() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem(THEME_KEY, isDark ? 'dark' : 'light');
            showToast(isDark ? '已切換至深色模式' : '已切換至淺色模式', 'info');
        }

        // LocalStorage Management
        function loadTasksFromStorage() {
            try {
                const data = localStorage.getItem(STORAGE_KEY);
                if (data) {
                    tasks = JSON.parse(data);
                } else {
                    // Default Initial Demo Tasks
                    tasks = [
                        {
                            id: generateId(),
                            title: '歡迎使用 TaskFlow！點擊勾選即可完成任務 🎉',
                            description: '這是一個支援 LocalStorage 的離線待辦清單。',
                            category: '個人',
                            priority: 'high',
                            dueDate: new Date().toISOString().split('T')[0],
                            completed: false,
                            createdAt: Date.now(),
                            subtasks: [
                                { id: generateId(), title: '瀏覽進度條變化', completed: false },
                                { id: generateId(), title: '嘗試新增一條新待辦事項', completed: false }
                            ]
                        },
                        {
                            id: generateId(),
                            title: '練習使用篩選與分類功能 📚',
                            description: '可以在左側選單依分類查看任務。',
                            category: '學習',
                            priority: 'medium',
                            dueDate: '',
                            completed: true,
                            createdAt: Date.now() - 86400000,
                            subtasks: []
                        }
                    ];
                    saveTasksToStorage();
                }
            } catch (e) {
                console.error('Failed to load tasks:', e);
                tasks = [];
            }
            renderApp();
        }

        function saveTasksToStorage() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
            } catch (e) {
                showToast('儲存失敗：LocalStorage 可能已滿', 'error');
            }
        }

        function generateId() {
            return Date.now().toString(36) + Math.random().toString(36).substr(2, 5);
        }

        // Task CRUD Actions
        function handleAddTask(e) {
            e.preventDefault();
            const titleInput = document.getElementById('taskTitleInput');
            const categoryInput = document.getElementById('taskCategoryInput');
            const priorityInput = document.getElementById('taskPriorityInput');
            const dueDateInput = document.getElementById('taskDueDateInput');

            const title = titleInput.value.trim();
            if (!title) return;

            const newTask = {
                id: generateId(),
                title: title,
                description: '',
                category: categoryInput.value,
                priority: priorityInput.value,
                dueDate: dueDateInput.value,
                completed: false,
                createdAt: Date.now(),
                subtasks: []
            };

            tasks.unshift(newTask);
            saveTasksToStorage();
            renderApp();

            // Reset form
            titleInput.value = '';
            showToast('已成功新增任務！', 'success');
        }

        function toggleTaskComplete(id) {
            const task = tasks.find(t => t.id === id);
            if (!task) return;

            task.completed = !task.completed;
            
            // Trigger celebration effect if completed
            if (task.completed) {
                confetti({
                    particleCount: 40,
                    spread: 60,
                    origin: { y: 0.8 }
                });
                showToast('太棒了！已完成任務', 'success');
            }

            saveTasksToStorage();
            renderApp();
        }

        function deleteTask(id) {
            tasks = tasks.filter(t => t.id !== id);
            saveTasksToStorage();
            renderApp();
            showToast('已刪除該事項', 'info');
        }

        function clearCompletedTasks() {
            const completedCount = tasks.filter(t => t.completed).length;
            if (completedCount === 0) {
                showToast('目前沒有已完成事項可供清除', 'info');
                return;
            }

            tasks = tasks.filter(t => !t.completed);
            saveTasksToStorage();
            renderApp();
            showToast(`已清空 ${completedCount} 個已完成事項`, 'success');
        }

        // Task Edit Modal Logic
        function openEditModal(id) {
            const task = tasks.find(t => t.id === id);
            if (!task) return;

            document.getElementById('editTaskId').value = task.id;
            document.getElementById('editTitleInput').value = task.title;
            document.getElementById('editDescInput').value = task.description || '';
            document.getElementById('editCategoryInput').value = task.category;
            document.getElementById('editPriorityInput').value = task.priority;
            document.getElementById('editDueDateInput').value = task.dueDate || '';

            currentEditingSubtasks = JSON.parse(JSON.stringify(task.subtasks || []));
            renderSubtaskEditList();

            const modal = document.getElementById('editModal');
            const container = document.getElementById('modalContainer');
            modal.classList.remove('opacity-0', 'pointer-events-none');
            container.classList.remove('scale-95');
            container.classList.add('scale-100');
        }

        function closeEditModal() {
            const modal = document.getElementById('editModal');
            const container = document.getElementById('modalContainer');
            modal.classList.add('opacity-0', 'pointer-events-none');
            container.classList.remove('scale-100');
            container.classList.add('scale-95');
        }

        function saveEditedTask(e) {
            e.preventDefault();
            const id = document.getElementById('editTaskId').value;
            const task = tasks.find(t => t.id === id);
            if (!task) return;

            task.title = document.getElementById('editTitleInput').value.trim();
            task.description = document.getElementById('editDescInput').value.trim();
            task.category = document.getElementById('editCategoryInput').value;
            task.priority = document.getElementById('editPriorityInput').value;
            task.dueDate = document.getElementById('editDueDateInput').value;
            task.subtasks = currentEditingSubtasks;

            saveTasksToStorage();
            renderApp();
            closeEditModal();
            showToast('任務已更新', 'success');
        }

        // Subtasks Editing Controls
        function renderSubtaskEditList() {
            const container = document.getElementById('subtaskContainer');
            container.innerHTML = '';

            currentEditingSubtasks.forEach((sub, index) => {
                const item = document.createElement('div');
                item.className = 'flex items-center gap-2 bg-slate-50 dark:bg-slate-900 px-3 py-1.5 rounded-lg border border-slate-200 dark:border-slate-700 text-xs';
                item.innerHTML = `
                    <input type="checkbox" ${sub.completed ? 'checked' : ''} onchange="toggleEditingSubtask(${index})" class="rounded text-sky-500">
                    <span class="flex-1 ${sub.completed ? 'line-through text-slate-400' : 'text-slate-700 dark:text-slate-200'}">${escapeHtml(sub.title)}</span>
                    <button type="button" onclick="removeEditingSubtask(${index})" class="text-rose-500 hover:text-rose-700">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                `;
                container.appendChild(item);
            });
        }

        function handleAddSubtask() {
            const input = document.getElementById('newSubtaskInput');
            const val = input.value.trim();
            if (!val) return;

            currentEditingSubtasks.push({
                id: generateId(),
                title: val,
                completed: false
            });
            input.value = '';
            renderSubtaskEditList();
        }

        function toggleEditingSubtask(index) {
            currentEditingSubtasks[index].completed = !currentEditingSubtasks[index].completed;
            renderSubtaskEditList();
        }

        function removeEditingSubtask(index) {
            currentEditingSubtasks.splice(index, 1);
            renderSubtaskEditList();
        }

        function toggleMainSubtask(taskId, subtaskId) {
            const task = tasks.find(t => t.id === taskId);
            if (!task) return;
            const sub = task.subtasks.find(s => s.id === subtaskId);
            if (!sub) return;

            sub.completed = !sub.completed;
            saveTasksToStorage();
            renderApp();
        }

        // Main Render Pipeline
        function renderApp() {
            renderStats();
            renderCategoriesSidebar();
            renderTasks();
            updateFilterTabsUI();
        }

        // Statistics & Progress Dashboard
        function renderStats() {
            const total = tasks.length;
            const completed = tasks.filter(t => t.completed).length;
            const pending = total - completed;

            const todayStr = new Date().toISOString().split('T')[0];
            const overdue = tasks.filter(t => !t.completed && t.dueDate && t.dueDate < todayStr).length;

            const percent = total === 0 ? 0 : Math.round((completed / total) * 100);

            document.getElementById('statTotal').innerText = total;
            document.getElementById('statCompleted').innerText = completed;
            document.getElementById('statPending').innerText = pending;
            document.getElementById('statOverdue').innerText = overdue;
            document.getElementById('completionBadge').innerText = `${percent}% 完成`;
            document.getElementById('progressBar').style.width = `${percent}%`;
            document.getElementById('activeCountText').innerText = `剩餘 ${pending} 個未完成任務`;
        }

        // Sidebar Category List
        function renderCategoriesSidebar() {
            const container = document.getElementById('categoryList');
            container.innerHTML = '';

            // 'All' item
            const allActive = currentFilterCategory === 'all';
            const allBtn = document.createElement('button');
            allBtn.onclick = () => setFilterCategory('all');
            allBtn.className = `w-full flex items-center justify-between px-3 py-2 rounded-xl text-sm transition ${
                allActive 
                ? 'bg-sky-50 dark:bg-sky-950/60 text-sky-600 dark:text-sky-400 font-semibold' 
                : 'text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-700/50'
            }`;
            allBtn.innerHTML = `
                <span class="flex items-center gap-2.5">
                    <i class="fa-solid fa-layer-group w-4 text-center"></i> 所有任務
                </span>
                <span class="text-xs px-2 py-0.5 rounded-full ${allActive ? 'bg-sky-200 dark:bg-sky-900 text-sky-700 dark:text-sky-300' : 'bg-slate-100 dark:bg-slate-700'}">${tasks.length}</span>
            `;
            container.appendChild(allBtn);

            // Category Items
            Object.keys(categoriesConfig).forEach(cat => {
                const count = tasks.filter(t => t.category === cat).length;
                const isActive = currentFilterCategory === cat;
                const cfg = categoriesConfig[cat];

                const btn = document.createElement('button');
                btn.onclick = () => setFilterCategory(cat);
                btn.className = `w-full flex items-center justify-between px-3 py-2 rounded-xl text-sm transition ${
                    isActive 
                    ? 'bg-sky-50 dark:bg-sky-950/60 text-sky-600 dark:text-sky-400 font-semibold' 
                    : 'text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-700/50'
                }`;
                btn.innerHTML = `
                    <span class="flex items-center gap-2.5">
                        <i class="fa-solid ${cfg.icon} w-4 text-center"></i> ${cat}
                    </span>
                    <span class="text-xs px-2 py-0.5 rounded-full ${isActive ? 'bg-sky-200 dark:bg-sky-900 text-sky-700 dark:text-sky-300' : 'bg-slate-100 dark:bg-slate-700'}">${count}</span>
                `;
                container.appendChild(btn);
            });
        }

        // Render Task Cards List
        function renderTasks() {
            const listContainer = document.getElementById('taskList');
            listContainer.innerHTML = '';

            // Filter Pipeline
            let filtered = tasks.filter(task => {
                // Status Filter
                if (currentFilterStatus === 'active' && task.completed) return false;
                if (currentFilterStatus === 'completed' && !task.completed) return false;

                // Category Filter
                if (currentFilterCategory !== 'all' && task.category !== currentFilterCategory) return false;

                // Search Query Filter
                if (searchQuery) {
                    const q = searchQuery.toLowerCase();
                    const titleMatch = task.title.toLowerCase().includes(q);
                    const descMatch = (task.description || '').toLowerCase().includes(q);
                    if (!titleMatch && !descMatch) return false;
                }

                return true;
            });

            // Sorting
            const sortBy = document.getElementById('sortByInput').value;
            filtered.sort((a, b) => {
                if (sortBy === 'created-desc') return b.createdAt - a.createdAt;
                if (sortBy === 'dueDate-asc') {
                    if (!a.dueDate) return 1;
                    if (!b.dueDate) return -1;
                    return a.dueDate.localeCompare(b.dueDate);
                }
                if (sortBy === 'priority-desc') {
                    const weight = { high: 3, medium: 2, low: 1 };
                    return weight[b.priority] - weight[a.priority];
                }
                return 0;
            });

            // Empty State
            if (filtered.length === 0) {
                listContainer.innerHTML = `
                    <div class="flex flex-col items-center justify-center py-12 text-center bg-white dark:bg-slate-800 rounded-2xl border border-dashed border-slate-200 dark:border-slate-700 p-6">
                        <div class="w-16 h-16 rounded-full bg-slate-100 dark:bg-slate-700/50 flex items-center justify-center text-slate-400 text-2xl mb-3">
                            <i class="fa-solid fa-clipboard-check"></i>
                        </div>
                        <p class="text-base font-semibold text-slate-700 dark:text-slate-300">查無相關待辦事項</p>
                        <p class="text-xs text-slate-400 mt-1">您可以嘗試變更搜尋條件或新增一個任務！</p>
                    </div>
                `;
                return;
            }

            const todayStr = new Date().toISOString().split('T')[0];

            // Render Task Cards
            filtered.forEach(task => {
                const isOverdue = !task.completed && task.dueDate && task.dueDate < todayStr;
                const categoryInfo = categoriesConfig[task.category] || { icon: 'fa-tag', color: 'text-slate-500 bg-slate-100' };
                const priorityInfo = priorityConfig[task.priority] || priorityConfig['medium'];

                const card = document.createElement('div');
                card.className = `task-card bg-white dark:bg-slate-800 rounded-2xl p-4 border ${
                    task.completed 
                    ? 'border-slate-200/60 dark:border-slate-700/60 opacity-75' 
                    : isOverdue 
                        ? 'border-rose-300 dark:border-rose-800/80 shadow-sm' 
                        : 'border-slate-200/80 dark:border-slate-700/80 shadow-sm'
                } ${task.completed ? 'is-completed' : ''}`;

                // Subtasks Progress HTML
                let subtasksHtml = '';
                if (task.subtasks && task.subtasks.length > 0) {
                    const subCompleted = task.subtasks.filter(s => s.completed).length;
                    subtasksHtml = `
                        <div class="mt-3 pt-2.5 border-t border-slate-100 dark:border-slate-700/60 space-y-1.5">
                            <div class="flex items-center justify-between text-xs text-slate-500 dark:text-slate-400 mb-1">
                                <span>子任務 (${subCompleted}/${task.subtasks.length})</span>
                            </div>
                            <div class="space-y-1">
                                ${task.subtasks.map(sub => `
                                    <div class="flex items-center gap-2 text-xs text-slate-600 dark:text-slate-300">
                                        <input type="checkbox" ${sub.completed ? 'checked' : ''} 
                                            onchange="toggleMainSubtask('${task.id}', '${sub.id}')"
                                            class="rounded text-sky-500 focus:ring-0 cursor-pointer">
                                        <span class="${sub.completed ? 'line-through opacity-60' : ''}">${escapeHtml(sub.title)}</span>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `;
                }

                card.innerHTML = `
                    <div class="flex items-start gap-3">
                        <!-- Custom Checkbox -->
                        <button onclick="toggleTaskComplete('${task.id}')" class="mt-0.5 shrink-0 text-xl transition-colors ${
                            task.completed ? 'text-emerald-500' : 'text-slate-300 dark:text-slate-600 hover:text-sky-500'
                        }">
                            <i class="fa-${task.completed ? 'solid' : 'regular'} fa-circle-check"></i>
                        </button>

                        <!-- Content Area -->
                        <div class="flex-1 min-w-0">
                            <div class="flex flex-wrap items-center gap-2 mb-1">
                                <!-- Category Badge -->
                                <span class="inline-flex items-center gap-1 text-[11px] px-2 py-0.5 rounded-md font-medium border ${categoryInfo.color}">
                                    <i class="fa-solid ${categoryInfo.icon} text-[10px]"></i> ${task.category}
                                </span>

                                <!-- Priority Badge -->
                                <span class="inline-flex items-center text-[11px] px-2 py-0.5 rounded-md font-medium ${priorityInfo.color}">
                                    ${priorityInfo.label}
                                </span>

                                <!-- Due Date Indicator -->
                                ${task.dueDate ? `
                                    <span class="inline-flex items-center gap-1 text-[11px] px-2 py-0.5 rounded-md font-medium ${
                                        isOverdue 
                                        ? 'bg-rose-100 dark:bg-rose-950/80 text-rose-600 dark:text-rose-300 animate-pulse' 
                                        : 'bg-slate-100 dark:bg-slate-700/60 text-slate-500 dark:text-slate-400'
                                    }">
                                        <i class="fa-regular fa-clock text-[10px]"></i> ${task.dueDate} ${isOverdue ? '(已逾期)' : ''}
                                    </span>
                                ` : ''}
                            </div>

                            <!-- Title -->
                            <h4 class="text-sm font-semibold text-slate-800 dark:text-slate-100 completed-line break-words">
                                ${escapeHtml(task.title)}
                            </h4>

                            <!-- Description -->
                            ${task.description ? `
                                <p class="text-xs text-slate-500 dark:text-slate-400 mt-1 line-clamp-2 break-words">
                                    ${escapeHtml(task.description)}
                                </p>
                            ` : ''}

                            ${subtasksHtml}
                        </div>

                        <!-- Action Controls -->
                        <div class="flex items-center gap-1 shrink-0">
                            <button onclick="openEditModal('${task.id}')" title="編輯" class="p-1.5 text-slate-400 hover:text-sky-500 dark:hover:text-sky-400 transition rounded-lg">
                                <i class="fa-solid fa-pen"></i>
                            </button>
                            <button onclick="deleteTask('${task.id}')" title="刪除" class="p-1.5 text-slate-400 hover:text-rose-500 dark:hover:text-rose-400 transition rounded-lg">
                                <i class="fa-solid fa-trash-can"></i>
                            </button>
                        </div>
                    </div>
                `;

                listContainer.appendChild(card);
            });
        }

        // Filter Handlers
        function setFilterStatus(status) {
            currentFilterStatus = status;
            renderTasks();
            updateFilterTabsUI();
        }

        function setFilterCategory(cat) {
            currentFilterCategory = cat;
            renderApp();
        }

        function handleSearch() {
            searchQuery = document.getElementById('searchInput').value.trim();
            renderTasks();
        }

        function updateFilterTabsUI() {
            const tabs = {
                all: document.getElementById('tabAll'),
                active: document.getElementById('tabActive'),
                completed: document.getElementById('tabCompleted')
            };

            Object.keys(tabs).forEach(key => {
                if (key === currentFilterStatus) {
                    tabs[key].className = 'filter-tab flex-1 sm:flex-initial px-3.5 py-1.5 rounded-lg font-medium transition bg-white dark:bg-slate-700 text-sky-600 dark:text-sky-300 shadow-sm';
                } else {
                    tabs[key].className = 'filter-tab flex-1 sm:flex-initial px-3.5 py-1.5 rounded-lg font-medium transition text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white';
                }
            });
        }

        // Data Backup & Import System
        function toggleDataMenu() {
            const menu = document.getElementById('dataMenu');
            menu.classList.toggle('hidden');
        }

        function exportTasks() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(tasks, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `TaskFlow_Backup_${new Date().toISOString().split('T')[0]}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
            showToast('已匯出 JSON 備份檔', 'success');
        }

        function triggerImport() {
            document.getElementById('importFileInput').click();
        }

        function importTasks(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const importedData = JSON.parse(e.target.result);
                    if (Array.isArray(importedData)) {
                        tasks = importedData;
                        saveTasksToStorage();
                        renderApp();
                        showToast('已成功匯入待辦清單資料！', 'success');
                    } else {
                        showToast('格式不符合 TaskFlow 格式', 'error');
                    }
                } catch (err) {
                    showToast('讀取 JSON 檔案失敗', 'error');
                }
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        function clearAllData() {
            if (confirm('確定要清空所有待辦事項嗎？此動作無法復原！')) {
                tasks = [];
                saveTasksToStorage();
                renderApp();
                showToast('已清空所有本地資料', 'info');
            }
        }

        // Notification Toast System
        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');

            const icons = {
                success: 'fa-circle-check text-emerald-500',
                error: 'fa-circle-exclamation text-rose-500',
                info: 'fa-circle-info text-sky-500'
            };

            toast.className = 'flex items-center gap-2.5 bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 px-4 py-3 rounded-xl shadow-lg border border-slate-100 dark:border-slate-700 text-sm transform transition-all duration-300 translate-y-5 opacity-0 pointer-events-auto';
            toast.innerHTML = `
                <i class="fa-solid ${icons[type]} text-base"></i>
                <span>${escapeHtml(message)}</span>
            `;

            container.appendChild(toast);

            // Animate in
            setTimeout(() => {
                toast.classList.remove('translate-y-5', 'opacity-0');
            }, 10);

            // Animate out
            setTimeout(() => {
                toast.classList.add('translate-y-5', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // Utility: HTML Sanitizer
        function escapeHtml(str) {
            if (!str) return '';
            return str
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
